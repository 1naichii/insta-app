name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: insta_app_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insta_app_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd
          coverage: none

      - name: 3. Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 4. Run a PostgreSQL 18.4 service
        run: pg_isready --host=127.0.0.1 --port=5432 --username=postgres --dbname=insta_app_ci
        env:
          PGPASSWORD: postgres

      - name: 5. Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 6. Install Bun dependencies with a frozen lockfile
        run: bun install --frozen-lockfile

      - name: 7. Prepare the environment
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          cp .env.e2e.example .env.e2e
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=insta_app_ci/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=insta_app_ci/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=insta_app_e2e_ci/' .env.e2e
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.e2e
          php artisan key:generate --no-interaction
          php artisan key:generate --env=testing --no-interaction
          php artisan key:generate --env=e2e --no-interaction
          php artisan wayfinder:generate --with-form --no-interaction
          # public/storage is gitignored, so the symlink that serves uploaded
          # and seeded images does not exist on a fresh checkout.
          php artisan storage:link --no-interaction

      - name: 8. Run migrations and seeders
        run: |
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=postgres --command="CREATE DATABASE insta_app_e2e_ci;"
          php artisan migrate:fresh --seed --env=testing --no-interaction
          php artisan migrate:fresh --seed --env=e2e --no-interaction

      - name: 9. Laravel Pint check
        run: vendor/bin/pint --test

      - name: 10. TypeScript typecheck
        run: bun run typecheck

      - name: 11. ESLint
        run: bun run lint

      - name: 12. Prettier check
        run: bun run format:check

      - name: 13. Vite production build
        run: bun run build

      - name: 14. Pest tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_DATABASE: insta_app_ci
          PAO_DISABLE: 'true'

      - name: 15. Vitest React tests
        run: bun run test:react

      - name: 16. Vitest coverage
        run: bun run test:react:coverage

      - name: 17. Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: 18. Playwright E2E tests
        run: bun run test:e2e

      - name: 19. Upload reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            coverage/
            storage/logs/
          if-no-files-found: ignore
